appId: com.buggybooks.app
tags:
  - checkout
  - chaos
  - anti-pattern
---
# Flow: 05_checkout_retry_loop.yaml
# Description: Fill checkout form, dismiss occluding keyboard (MOB-B2), handle stochastic 500 retry loop (MOB-B4)
- launchApp:
    clearState: false

# Open Cart tab and proceed to checkout
- tapOn:
    id: "tab_cart"

- extendedWaitUntil:
    visible:
      id: "btn-proceed-checkout"
    timeout: 5000

- tapOn:
    id: "btn-proceed-checkout"

# Assert on Checkout screen with obfuscated testIDs (MOB-B1)
- extendedWaitUntil:
    visible:
      id: "txt_f1"
    timeout: 5000

# Fill shipping and payment fields
- tapOn:
    id: "txt_f1"
- inputText: "Jane"

- tapOn:
    id: "txt_l1"
- inputText: "Doe"

- tapOn:
    id: "txt_addr_88"
- inputText: "123 Buggy Lane, Suite 404"

- tapOn:
    id: "txt_c99"
- inputText: "4242424242424242"

# Explicitly dismiss soft keyboard to overcome keyboard occlusion (MOB-B2)
- hideKeyboard

# Scroll down to reveal Place Order button if needed
- scroll

# Submit order
- tapOn:
    id: "btn_place_order"

# Handle stochastic 500 payment gateway error & retry loop (MOB-B4)
- tapOn:
    id: "btn_retry_payment"
    optional: true

# Assert final order confirmation screen
- extendedWaitUntil:
    visible:
      id: "order_confirmation_container"
    timeout: 10000

- assertVisible:
    id: "order_confirmation_container"
