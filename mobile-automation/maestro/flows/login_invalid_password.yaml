# MOB_M0_04: a wrong password shows the server's error and keeps the user on the login screen.
appId: ${APP_ID}
name: Login - wrong password is rejected
tags:
  - auth
---
- runScript: ../scripts/reset_backend.js
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: ${LOGIN_SCREEN}
    timeout: 30000
- tapOn:
    id: ${LOGIN_USERNAME}
- inputText: ${USER_TESTUSER_USERNAME}
- tapOn:
    id: ${LOGIN_PASSWORD}
- inputText: "not-the-password"
- hideKeyboard
- tapOn:
    id: ${LOGIN_SUBMIT}
- extendedWaitUntil:
    visible:
      id: ${LOGIN_ERROR}
    timeout: 20000
- assertVisible:
    id: ${LOGIN_ERROR}
    text: ".*Invalid credentials.*"
- assertVisible:
    id: ${LOGIN_SCREEN}
