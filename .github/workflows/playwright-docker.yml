name: Playwright Automation CI - Docker

on:
  workflow_dispatch:
    inputs:
      headless:
        description: 'Run browser in headless mode (true or false)'
        required: false
        default: 'true'
      branch:
        description: 'Git branch to checkout for this run'
        required: false
        default: 'main'

concurrency:
  group: pages-deploy-allure
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # JOB 1: Run Tests inside Docker with Playwright Native Dynamic Sharding
  test:
    name: UI & API Automation (Docker) - Shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4, 5, 6, 7, 8]
        shardTotal: [8]

    container:
      image: mcr.microsoft.com/playwright:v1.58.0-jammy

    env:
      ENV: INTEROP
      BASE_URL: https://buggy-books-fe.onrender.com/
      API_BASE_URL: https://buggy-books.onrender.com
      HEADLESS: ${{ github.event.inputs.headless || 'true' }}
      BROWSER: chrome
      USER_NAME: ${{ secrets.E2E_USER_NAME }}
      PASSWORD: ${{ secrets.E2E_PASSWORD }}
      SHARD_INDEX: ${{ matrix.shardIndex }}
      SHARD_TOTAL: ${{ matrix.shardTotal }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: ${{ github.event.inputs.branch || 'main' }}

      - name: Install dependencies
        working-directory: playwright-e2e
        run: |
          npm ci
          npx playwright install --with-deps chrome

      - name: Run tests - Shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
        working-directory: playwright-e2e
        env:
          ENVIRONMENT: INTEROP
          TZ: Australia/Adelaide
        run: |
          echo "Executing native dynamic shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }}"
          npx playwright test --config=src/config/playwright.config.ts --project=chromium --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }} --reporter=blob,allure-playwright,list

      - name: Upload Blob Report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.1
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: playwright-e2e/blob-report
          retention-days: 7

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.1
        with:
          name: allure-results-shard-${{ matrix.shardIndex }}
          path: playwright-e2e/reports/allure-results
          retention-days: 7

      - name: Upload Playwright Failure Traces & Screenshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.1
        with:
          name: playwright-traces-shard-${{ matrix.shardIndex }}
          path: |
            playwright-e2e/test-results/
            playwright-e2e/reports/test-artifacts/
          retention-days: 7

  # JOB 2: Merge Blob Reports, Build Allure Dashboard & Deploy
  merge-reports:
    name: Merge Reports & Deploy
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: ${{ github.event.inputs.branch || 'main' }}

      - name: Set up Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: playwright-e2e/package-lock.json

      - name: Install Playwright Dependencies
        working-directory: playwright-e2e
        run: npm ci

      - name: Download all Blob Reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: blob-report-*
          path: playwright-e2e/all-blobs
          merge-multiple: true

      - name: Merge Playwright Blob Reports into HTML Report
        working-directory: playwright-e2e
        run: |
          npx playwright merge-reports --reporter=html all-blobs

      - name: Upload Consolidated HTML Report Artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.1
        with:
          name: playwright-html-report
          path: playwright-e2e/playwright-report
          retention-days: 7

      - name: Checkout gh-pages
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Download All Allure Results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: allure-results-shard-*
          path: allure-results
          merge-multiple: true

      - name: Test Report Summary
        run: |
          echo "### 📊 Sharded Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Execution Strategy:** Playwright Native Dynamic Sharding (8 Shards)" >> $GITHUB_STEP_SUMMARY
          echo "- **Report Link:** https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/AutomationReports/Docker/${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY

      - name: Generate Allure Report
        uses: simple-elf/allure-report-action@385367cde61ac68c2568a117f7579f7f148dc459 # v1.12
        with:
          allure_results: allure-results
          gh_pages: gh-pages
          allure_report: allure-report
          allure_history: allure-history
          keep_reports: 7
          subfolder: AutomationReports/Docker

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@373f7f263a76c20808c831209c920827a82a2847 # v3.9.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
          keep_files: true

      - name: Print Report URL
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          OWNER="${{ github.repository_owner }}"
          echo "✅ Report published successfully!"
          echo "📊 Report URL: https://${OWNER}.github.io/${REPO_NAME}/AutomationReports/Docker/${{ github.run_number }}"
          echo "📈 Check the job summary for detailed test results."
