# =============================================================
# BuggyBooks – Continuous Integration Workflow
#
# Runs on every push and pull request to main.
# Staged Fast-Feedback Pipeline:
#   Stage 1 (Fast Gates & Unit Tests):
#     - backend-tests  — ESLint + Jest unit/integration tests
#     - frontend-tests — ESLint + Vitest component tests
#   Stage 2 (Compilation & Build Verification):
#     - backend-build  — Backend TypeScript build verification (tsc)
#     - frontend-build — Frontend Vite & TypeScript build verification
#   Stage 3 (Downstream Quality Gates):
#     - e2e-quality-gate — Playwright TypeScript typing & POM static architecture linter
# =============================================================

name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # -----------------------------------------------------------
  # Stage 1A: Backend Tests & ESLint (Jest)
  # -----------------------------------------------------------
  backend-tests:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Jest tests
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-secret-do-not-use-in-production

  # -----------------------------------------------------------
  # Stage 1B: Frontend Tests & ESLint (Vitest)
  # -----------------------------------------------------------
  frontend-tests:
    name: Frontend Tests & Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Run ESLint
        run: npm run lint

      - name: Run Vitest tests
        run: npm test
        env:
          VITE_API_URL: http://localhost:4000/api

  # -----------------------------------------------------------
  # Stage 2A: Backend TypeScript Build Verification
  # -----------------------------------------------------------
  backend-build:
    name: Backend TypeScript Build
    runs-on: ubuntu-latest
    needs: backend-tests

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build
        env:
          JWT_SECRET: ci-test-secret-do-not-use-in-production

  # -----------------------------------------------------------
  # Stage 2B: Frontend Vite & TypeScript Build Verification
  # -----------------------------------------------------------
  frontend-build:
    name: Frontend Vite Build
    runs-on: ubuntu-latest
    needs: frontend-tests

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build Frontend
        run: npm run build

  # -----------------------------------------------------------
  # Stage 3: Downstream E2E Quality Gate & Typecheck
  # -----------------------------------------------------------
  e2e-quality-gate:
    name: E2E Quality Gate & Typecheck
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, backend-build, frontend-build]

    defaults:
      run:
        working-directory: playwright-e2e

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: playwright-e2e/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck Playwright Suite
        run: npx tsc --noEmit

      - name: Validate Page Object Encapsulation & Static Rules
        run: npm run finalize-spec -- --all-poms
