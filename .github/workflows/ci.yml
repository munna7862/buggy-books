# =============================================================
# BuggyBooks – Continuous Integration Workflow
#
# Runs on every push and pull request to main.
# Staged Fast-Feedback Pipeline:
#   Stage 1 (Fast Feedback & Static Architecture Quality Gates):
#     - backend-tests    — ESLint + Jest unit/integration tests with coverage & summary
#     - frontend-tests   — ESLint + Vitest component tests with coverage & summary
#     - e2e-quality-gate — Playwright TypeScript typing & POM static architecture linter
#   Stage 2 (Compilation & Build Verification):
#     - backend-build    — Backend TypeScript build verification (tsc)
#     - frontend-build   — Frontend Vite & TypeScript build verification
#   Stage 3 (Downstream Performance & Audit Quality Gates):
#     - lighthouse-ci    — Headless Chrome audit & Core Web Vitals
#     - perf-benchmarks  — Tiered k6 API benchmarks (PR smoke vs main full stress)
#     - e2e-smoke        — Ephemeral Playwright E2E smoke gate against pre-built artifacts
# =============================================================

name: CI

on:
  push:
    branches: [main, "feature/**"]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.vscode/**'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.vscode/**'
      - '.gitignore'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # -----------------------------------------------------------
  # Stage 1A: Backend Tests & ESLint (Jest)
  # -----------------------------------------------------------
  backend-tests:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Jest tests with Coverage
        run: npm run test:ci
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-secret-do-not-use-in-production

      - name: Generate Backend Test & Coverage Summary
        if: always()
        run: node ../scripts/generate-test-summary.js backend .

      - name: Upload Backend Coverage Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage
          retention-days: 7

  # -----------------------------------------------------------
  # Stage 1B: Frontend Tests & ESLint (Vitest)
  # -----------------------------------------------------------
  frontend-tests:
    name: Frontend Tests & Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Vitest tests with Coverage
        run: npm run test:ci
        env:
          VITE_API_URL: http://localhost:4000/api

      - name: Generate Frontend Test & Coverage Summary
        if: always()
        run: node ../scripts/generate-test-summary.js frontend .

      - name: Upload Frontend Coverage Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage
          retention-days: 7

  # -----------------------------------------------------------
  # Stage 1C: E2E Quality Gate & Typecheck (Playwright POM Linter)
  # -----------------------------------------------------------
  e2e-quality-gate:
    name: E2E Quality Gate & Typecheck
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: playwright-e2e

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: playwright-e2e/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate Page Object Encapsulation & Static Rules
        run: npm run finalize-spec -- --all-poms

  # -----------------------------------------------------------
  # Stage 2A: Backend TypeScript Build Verification
  # -----------------------------------------------------------
  backend-build:
    name: Backend TypeScript Build
    runs-on: ubuntu-latest
    needs: backend-tests

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build
        env:
          JWT_SECRET: ci-test-secret-do-not-use-in-production

      - name: Upload Backend Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: backend/dist
          retention-days: 1

  # -----------------------------------------------------------
  # Stage 2B: Frontend Vite & TypeScript Build Verification
  # -----------------------------------------------------------
  frontend-build:
    name: Frontend Vite Build
    runs-on: ubuntu-latest
    needs: frontend-tests

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build

      - name: Upload Frontend Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  # -----------------------------------------------------------
  # Stage 3A: Lighthouse CI Quality Gate & Core Web Vitals
  # -----------------------------------------------------------
  lighthouse-ci:
    name: Lighthouse CI Quality Gate
    runs-on: ubuntu-latest
    needs: frontend-build

    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Download Frontend Dist Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Run Lighthouse CI Audit
        run: npx @lhci/cli autorun

      - name: Upload Lighthouse Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: |
            lhci-reports/
            .lighthouseci/
          retention-days: 7

  # -----------------------------------------------------------
  # Stage 3B: k6 API Performance Benchmarking
  # -----------------------------------------------------------
  perf-benchmarks:
    name: k6 API Performance Benchmarks
    runs-on: ubuntu-latest
    needs: backend-build

    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Download Backend Dist Artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-dist
          path: backend/dist

      - name: Install Backend Production Dependencies
        run: |
          cd backend
          npm ci --omit=dev

      - name: Start Backend Server
        run: |
          cd backend
          nohup node dist/server.js > ../server.log 2>&1 &
          npx wait-on -t 30000 http://127.0.0.1:4000/api/books || (cat ../server.log && exit 1)
        env:
          PORT: 4000
          NODE_ENV: development
          JWT_SECRET: ci-test-secret-do-not-use-in-production

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run PR Performance Smoke Benchmark (5 VUs)
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        run: |
          k6 run --summary-export=perf-summary-smoke.json performance/k6/smoke-load.js
          node performance/report-perf-summary.js perf-summary-smoke.json "PR API Smoke Benchmark (5 VUs)"

      - name: Run Main Catalog Load Benchmark (50 VUs)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          k6 run --summary-export=perf-summary-catalog.json performance/k6/catalog-load.js
          node performance/report-perf-summary.js perf-summary-catalog.json "Catalog Load Benchmark (50 VUs)"

      - name: Run Main Inventory Stress Benchmark
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          k6 run --summary-export=perf-summary-inventory.json performance/k6/inventory-stress.js
          node performance/report-perf-summary.js perf-summary-inventory.json "Inventory Stress Benchmark (30 VUs)"

      - name: Upload Performance Summary Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-summaries
          path: |
            perf-summary*.json
            performance/k6-summary*.md
          retention-days: 7

      - name: Stop Backend Server
        if: always()
        run: pkill -f "node dist/server.js" || true

  # -----------------------------------------------------------
  # Stage 3C: Ephemeral Playwright E2E Smoke Gate
  # -----------------------------------------------------------
  e2e-smoke:
    name: Playwright E2E Smoke Gate
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build]

    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
            playwright-e2e/package-lock.json

      - name: Download Backend Dist Artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-dist
          path: backend/dist

      - name: Download Frontend Dist Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Install Backend Production Dependencies
        run: |
          cd backend
          npm ci --omit=dev

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Install Playwright Dependencies
        working-directory: playwright-e2e
        run: npm ci

      - name: Get Playwright version
        id: playwright-version
        working-directory: playwright-e2e
        run: echo "version=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> $GITHUB_OUTPUT

      - name: Cache Playwright Browser Binaries
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-v2

      - name: Install Playwright Browsers & OS Dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: playwright-e2e
        run: npx playwright install --with-deps chromium chrome

      - name: Install Playwright OS Dependencies Only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: playwright-e2e
        run: |
          npx playwright install-deps chromium chrome
          npx playwright install chromium chrome

      - name: Start Ephemeral Backend Server
        run: |
          cd backend
          nohup node dist/server.js > ../backend-server.log 2>&1 &
          npx wait-on -t 30000 http://127.0.0.1:4000/api/books || (cat ../backend-server.log && exit 1)
        env:
          PORT: 4000
          NODE_ENV: development
          JWT_SECRET: ci-test-secret-do-not-use-in-production

      - name: Start Ephemeral Frontend Preview Server
        run: |
          cd frontend
          nohup npx vite preview --port 5173 --host 127.0.0.1 > ../frontend-preview.log 2>&1 &
          npx wait-on -t 30000 http://127.0.0.1:5173 || (cat ../frontend-preview.log && exit 1)

      - name: Run Playwright E2E Smoke Tests
        working-directory: playwright-e2e
        env:
          ENV: CI
          BASE_URL: http://127.0.0.1:5173
          API_BASE_URL: http://127.0.0.1:4000
          HEADLESS: "true"
          BROWSER: chrome
          USER_NAME: admin
          PASSWORD: password123
          ELEMENT_TIMEOUT: 15000
          CI: "true"
        run: |
          npx playwright test --grep "@smoke" --grep-invert "@quarantine" --workers=2

      - name: Upload Playwright Failure Artifacts (Traces & Screenshots)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-smoke-failure-artifacts
          path: |
            playwright-e2e/test-results/
            playwright-e2e/reports/
          retention-days: 7

      - name: Upload Ephemeral Server Logs on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ephemeral-server-logs
          path: |
            backend-server.log
            frontend-preview.log
          retention-days: 3

      - name: Stop Ephemeral Servers
        if: always()
        run: |
          pkill -f "node dist/server.js" || true
          pkill -f "vite preview" || true

