# =============================================================
# BuggyBooks – Continuous Integration Workflow
#
# Runs on every push and pull request to main.
# Staged Fast-Feedback Pipeline:
#   Stage 1 (Fast Feedback & Static Architecture Quality Gates):
#     - backend-tests    — ESLint + Jest unit/integration tests
#     - frontend-tests   — ESLint + Vitest component tests
#     - e2e-quality-gate — Playwright TypeScript typing & POM static architecture linter
#   Stage 2 (Compilation & Build Verification):
#     - backend-build    — Backend TypeScript build verification (tsc)
#     - frontend-build   — Frontend Vite & TypeScript build verification
#   Stage 3 (Downstream Performance & Audit Quality Gates):
#     - lighthouse-ci    — Headless Chrome audit & Core Web Vitals
#     - perf-benchmarks  — k6 API performance load & stress tests
# =============================================================

name: CI

on:
  push:
    branches: [main, "feature/**"]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.vscode/**'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.vscode/**'
      - '.gitignore'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # -----------------------------------------------------------
  # Stage 1A: Backend Tests & ESLint (Jest)
  # -----------------------------------------------------------
  backend-tests:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Jest tests
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-secret-do-not-use-in-production

  # -----------------------------------------------------------
  # Stage 1B: Frontend Tests & ESLint (Vitest)
  # -----------------------------------------------------------
  frontend-tests:
    name: Frontend Tests & Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Vitest tests
        run: npm test
        env:
          VITE_API_URL: http://localhost:4000/api

  # -----------------------------------------------------------
  # Stage 1C: E2E Quality Gate & Typecheck (Playwright POM Linter)
  # -----------------------------------------------------------
  e2e-quality-gate:
    name: E2E Quality Gate & Typecheck
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: playwright-e2e

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: playwright-e2e/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate Page Object Encapsulation & Static Rules
        run: npm run finalize-spec -- --all-poms

  # -----------------------------------------------------------
  # Stage 2A: Backend TypeScript Build Verification
  # -----------------------------------------------------------
  backend-build:
    name: Backend TypeScript Build
    runs-on: ubuntu-latest
    needs: backend-tests

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build
        env:
          JWT_SECRET: ci-test-secret-do-not-use-in-production

      - name: Upload Backend Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: backend/dist
          retention-days: 1

  # -----------------------------------------------------------
  # Stage 2B: Frontend Vite & TypeScript Build Verification
  # -----------------------------------------------------------
  frontend-build:
    name: Frontend Vite Build
    runs-on: ubuntu-latest
    needs: frontend-tests

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build

      - name: Upload Frontend Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  # -----------------------------------------------------------
  # Stage 3A: Lighthouse CI Quality Gate & Core Web Vitals
  # -----------------------------------------------------------
  lighthouse-ci:
    name: Lighthouse CI Quality Gate
    runs-on: ubuntu-latest
    needs: frontend-build

    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Download Frontend Dist Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Run Lighthouse CI Audit
        run: npx @lhci/cli autorun

      - name: Upload Lighthouse Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: |
            lhci-reports/
            .lighthouseci/
          retention-days: 7

  # -----------------------------------------------------------
  # Stage 3B: k6 API Performance Benchmarking
  # -----------------------------------------------------------
  perf-benchmarks:
    name: k6 API Performance Benchmarks
    runs-on: ubuntu-latest
    needs: backend-build

    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Download Backend Dist Artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-dist
          path: backend/dist

      - name: Install Backend Production Dependencies
        run: |
          cd backend
          npm ci --omit=dev

      - name: Start Backend Server
        run: |
          cd backend
          nohup node dist/server.js > ../server.log 2>&1 &
          npx wait-on -t 30000 http://127.0.0.1:4000/api/books || (cat ../server.log && exit 1)
        env:
          PORT: 4000
          NODE_ENV: development
          JWT_SECRET: ci-test-secret-do-not-use-in-production

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run Catalog Load Benchmark (0 to 50 VUs)
        run: k6 run performance/k6/catalog-load.js

      - name: Run Inventory Stress Benchmark
        run: k6 run performance/k6/inventory-stress.js

      - name: Stop Backend Server
        if: always()
        run: pkill -f "node dist/server.js" || true
