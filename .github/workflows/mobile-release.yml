name: Mobile Release (APK Generation)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_profile:
        description: 'EAS / Gradle build profile'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production
          - development

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Standalone Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Set up Java 17
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Prebuild Android
        working-directory: mobile
        run: npx expo prebuild --platform android --clean

      - name: Assemble Android APK via Gradle
        working-directory: mobile/android
        run: |
          # Build APK via headless Gradle
          ./gradlew assembleDebug --no-daemon
          mkdir -p ../build-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk ../build-artifacts/BuggyBooks-${{ github.ref_name || 'preview' }}.apk

      - name: Upload Standalone APK Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.1
        with:
          name: buggybooks-android-apk
          path: mobile/build-artifacts/*.apk
          retention-days: 14

      - name: Create GitHub Release & Attach APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87238b5066dd85b40d7da # v2.2.1
        with:
          files: mobile/build-artifacts/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
