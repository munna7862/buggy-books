# =============================================================
# BuggyBooks – Playwright Quarantine Stability Audit & Governance
#
# Runs weekly on a scheduled cron and on demand via workflow_dispatch.
# Executes quarantined tests with repetition (--repeat-each=5) to compute
# the Quarantine Stability Index, generating actionable de-quarantine
# recommendations directly in $GITHUB_STEP_SUMMARY.
# =============================================================

name: Quarantine Stability Audit

on:
  schedule:
    # Run every Monday at 03:00 UTC
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      repeat_each:
        description: 'Repetition count per quarantined test'
        required: false
        default: '5'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quarantine-audit:
    name: Quarantined Test Stability Audit (5x Repetition)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: .

    env:
      ENV: LOCAL
      BASE_URL: http://127.0.0.1:5173
      API_BASE_URL: http://127.0.0.1:4000
      HEADLESS: 'true'
      REPEAT_EACH: ${{ github.event.inputs.repeat_each || '5' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Set up Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            playwright-e2e/package-lock.json

      - name: Install & Build Backend
        run: |
          cd backend
          npm ci
          npm run build
        env:
          JWT_SECRET: ci-test-secret-do-not-use-in-production

      - name: Install & Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build
        env:
          VITE_API_URL: http://127.0.0.1:4000/api

      - name: Install Playwright Dependencies
        working-directory: playwright-e2e
        run: npm ci

      - name: Get Playwright version
        id: playwright-version
        working-directory: playwright-e2e
        run: echo "version=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> $GITHUB_OUTPUT

      - name: Cache Playwright Browser Binaries
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-chromium

      - name: Install Playwright OS Dependencies & Chromium (Cache Miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: playwright-e2e
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS Dependencies Only (Cache Hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: playwright-e2e
        run: npx playwright install-deps chromium

      - name: Start Ephemeral Backend Server
        run: |
          cd backend
          nohup node dist/server.js > ../backend-server.log 2>&1 &
          npx wait-on -t 30000 http://127.0.0.1:4000/api/books || (cat ../backend-server.log && exit 1)
        env:
          PORT: 4000
          NODE_ENV: production
          JWT_SECRET: ci-test-secret-do-not-use-in-production

      - name: Start Ephemeral Frontend Preview Server
        run: |
          cd frontend
          nohup npx vite preview --port 5173 --host 0.0.0.0 > ../frontend-preview.log 2>&1 &
          npx wait-on -t 30000 http://127.0.0.1:5173 || (cat ../frontend-preview.log && exit 1)

      - name: Run Quarantine Stability Audit Runner
        working-directory: playwright-e2e
        env:
          REPEAT_EACH: ${{ github.event.inputs.repeat_each || '5' }}
          ENVIRONMENT: LOCAL
          TZ: Australia/Adelaide
          BASE_URL: http://127.0.0.1:5173
          API_BASE_URL: http://127.0.0.1:4000
        run: |
          npm run test:quarantine:audit

      - name: Upload Quarantine Audit Artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.1
        with:
          name: quarantine-audit-report
          path: |
            playwright-e2e/reports/quarantine-audit.md
            playwright-e2e/quarantine-results.json
            backend-server.log
            frontend-preview.log
          retention-days: 14

      - name: Stop Ephemeral Servers
        if: always()
        run: |
          pkill -f "node dist/server.js" || true
          pkill -f "vite preview" || true
