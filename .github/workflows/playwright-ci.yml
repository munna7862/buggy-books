name: Playwright Automation CI

on:
  workflow_dispatch:
    inputs:
      headless:
        description: 'Run browser in headless mode (true or false)'
        required: false
        default: 'true'
      branch:
        description: 'Git branch to checkout for this run'
        required: false
        default: 'main'
  schedule:
    - cron: '0 2 * * *' # Nightly cross-browser regression matrix run
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # JOB 1: Run Automation Tests across Cross-Browser and Mobile Matrix
  test:
    name: UI & API Automation (${{ matrix.project }})
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit, mobile-chrome, mobile-safari]
    
    env:
      ENV: INTEROP
      BASE_URL: https://buggy-books-fe.onrender.com/
      API_BASE_URL: https://buggy-books.onrender.com
      HEADLESS: ${{ github.event.inputs.headless || 'true' }}
      BROWSER: chrome
      USER_NAME: ${{ secrets.E2E_USER_NAME }}
      PASSWORD: ${{ secrets.E2E_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: playwright-e2e/package-lock.json
      
      - name: Install dependencies
        working-directory: playwright-e2e
        run: npm ci

      - name: Get Playwright version
        id: playwright-version
        working-directory: playwright-e2e
        run: echo "version=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> $GITHUB_OUTPUT

      - name: Cache Playwright Browser Binaries
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-${{ matrix.project }}-v2

      - name: Install Playwright Browsers & OS Dependencies
        working-directory: playwright-e2e
        run: |
          if [ "${{ matrix.project }}" = "firefox" ]; then
            npx playwright install --with-deps firefox
          elif [ "${{ matrix.project }}" = "webkit" ] || [ "${{ matrix.project }}" = "mobile-safari" ]; then
            npx playwright install --with-deps webkit
          else
            npx playwright install --with-deps chromium
          fi

      - name: Run Playwright Tests
        working-directory: playwright-e2e
        env:
          ENVIRONMENT: INTEROP
          TZ: Australia/Adelaide
          USER_NAME: ${{ secrets.E2E_USER_NAME }}
          PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: |
          npx playwright test --project=${{ matrix.project }}

      # Explicitly upload the allure-results folder for this matrix job
      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.project }}
          path: playwright-e2e/reports/allure-results
          retention-days: 7

  # JOB 2: Merge and Deploy Allure Report
  deploy-report:
    name: Deploy Allure Report
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # 1. Get history for trends
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      # 2. Download all matrix artifacts merged into allure-results
      - name: Download Allure Results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true

      - name: Test Report Summary
        run: |
          echo "- **Report Link:** https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/AutomationReports/CI/${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY

      # 3. Generate consolidated Allure report
      - name: Generate Allure Report
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: allure-results
          gh_pages: gh-pages
          allure_report: allure-report
          allure_history: allure-history
          keep_reports: 7
          subfolder: AutomationReports/CI

      # 4. Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
          keep_files: true

      # 5. Print GitHub Pages URL
      - name: Print Report URL
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          OWNER="${{ github.repository_owner }}"
          echo "✅ Report published successfully!"
          echo "📊 Report URL: https://${OWNER}.github.io/${REPO_NAME}/AutomationReports/CI/${{ github.run_number }}"
          echo "📈 Check the job summary for detailed test results."
