name: Playwright Automation CI

on:
  workflow_dispatch:
    inputs:
      headless:
        description: 'Run browser in headless mode (true or false)'
        required: false
        default: 'true'
      branch:
        description: 'Git branch to checkout for this run'
        required: false
        default: 'main'
  schedule:
    - cron: '0 2 * * *' # Nightly cross-browser regression matrix run
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # STAGE 1: Build Ephemeral Stack Artifacts for Hermetic Execution
  build-services:
    name: Build Ephemeral Stack Artifacts
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install & Build Backend
        run: |
          cd backend
          npm ci
          npm run build
        env:
          JWT_SECRET: ci-test-secret-do-not-use-in-production

      - name: Install & Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build
        env:
          VITE_API_URL: http://127.0.0.1:4000/api

      - name: Upload Backend Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: backend/dist
          retention-days: 1

      - name: Upload Frontend Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  # STAGE 2A: Dedicated Single-Pass API Test Execution
  api-tests:
    name: API Automation (Chromium)
    needs: [build-services]
    runs-on: ubuntu-latest

    env:
      ENV: LOCAL
      BASE_URL: http://127.0.0.1:5173
      API_BASE_URL: http://127.0.0.1:4000
      HEADLESS: 'true'
      BROWSER: chrome
      USER_NAME: ${{ secrets.E2E_USER_NAME || 'admin' }}
      PASSWORD: ${{ secrets.E2E_PASSWORD || 'password123' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            backend/package-lock.json
            playwright-e2e/package-lock.json

      - name: Download Backend Dist Artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-dist
          path: backend/dist

      - name: Install Backend Production Dependencies
        run: |
          cd backend
          npm ci --omit=dev

      - name: Install Playwright Dependencies
        working-directory: playwright-e2e
        run: npm ci

      - name: Install Playwright Chromium Browser
        working-directory: playwright-e2e
        run: npx playwright install --with-deps chromium

      - name: Start Ephemeral Backend Server
        run: |
          cd backend
          nohup node dist/server.js > ../backend-server.log 2>&1 &
          npx wait-on -t 30000 http://127.0.0.1:4000/api/books || (cat ../backend-server.log && exit 1)
        env:
          PORT: 4000
          NODE_ENV: production
          JWT_SECRET: ci-test-secret-do-not-use-in-production

      - name: Run API Automation Tests
        working-directory: playwright-e2e
        env:
          ENVIRONMENT: LOCAL
          TZ: Australia/Adelaide
          BASE_URL: http://127.0.0.1:5173
          API_BASE_URL: http://127.0.0.1:4000
          USER_NAME: ${{ secrets.E2E_USER_NAME || 'admin' }}
          PASSWORD: ${{ secrets.E2E_PASSWORD || 'password123' }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/api-results.json
        run: |
          npx playwright test src/tests/api --config=src/config/playwright.config.ts --project=chromium --workers=4 --reporter=blob,allure-playwright,list,json

      - name: Generate API Quality Gate Step Summary
        if: always()
        working-directory: playwright-e2e
        run: node scripts/generate-playwright-summary.js test-results/api-results.json "API Automation (Chromium)" "playwright-traces-api"

      - name: Upload Playwright Failure Traces & Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-api
          path: |
            playwright-e2e/test-results/
            playwright-e2e/reports/test-artifacts/
          retention-days: 7

      - name: Upload Ephemeral Server Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ephemeral-server-logs-api
          path: backend-server.log
          retention-days: 7

      - name: Upload Blob Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-api
          path: playwright-e2e/blob-report
          retention-days: 7

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-api
          path: playwright-e2e/reports/allure-results
          retention-days: 7

      - name: Stop Ephemeral Backend Server
        if: always()
        run: pkill -f "node dist/server.js" || true

  # STAGE 2B: Run UI Tests across Cross-Browser and Mobile Matrix
  ui-tests:
    name: UI Automation (${{ matrix.project }})
    needs: [build-services]
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit, mobile-chrome, mobile-safari]

    env:
      ENV: LOCAL
      BASE_URL: http://127.0.0.1:5173
      API_BASE_URL: http://127.0.0.1:4000
      HEADLESS: ${{ github.event.inputs.headless || 'true' }}
      BROWSER: chrome
      USER_NAME: ${{ secrets.E2E_USER_NAME || 'admin' }}
      PASSWORD: ${{ secrets.E2E_PASSWORD || 'password123' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
            playwright-e2e/package-lock.json

      - name: Download Backend Dist Artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-dist
          path: backend/dist

      - name: Download Frontend Dist Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Install Backend Production Dependencies
        run: |
          cd backend
          npm ci --omit=dev

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Install Playwright Dependencies
        working-directory: playwright-e2e
        run: npm ci

      - name: Get Playwright version
        id: playwright-version
        working-directory: playwright-e2e
        run: echo "version=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> $GITHUB_OUTPUT

      - name: Cache Playwright Browser Binaries
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-${{ matrix.project }}-v2

      - name: Install Playwright Browsers & OS Dependencies
        working-directory: playwright-e2e
        run: |
          if [ "${{ matrix.project }}" = "firefox" ]; then
            npx playwright install --with-deps firefox
          elif [ "${{ matrix.project }}" = "webkit" ] || [ "${{ matrix.project }}" = "mobile-safari" ]; then
            npx playwright install --with-deps webkit
          else
            npx playwright install --with-deps chromium
          fi

      - name: Start Ephemeral Backend Server
        run: |
          cd backend
          nohup node dist/server.js > ../backend-server.log 2>&1 &
          npx wait-on -t 30000 http://127.0.0.1:4000/api/books || (cat ../backend-server.log && exit 1)
        env:
          PORT: 4000
          NODE_ENV: production
          JWT_SECRET: ci-test-secret-do-not-use-in-production

      - name: Start Ephemeral Frontend Preview Server
        run: |
          cd frontend
          nohup npx vite preview --port 5173 --host 0.0.0.0 > ../frontend-preview.log 2>&1 &
          npx wait-on -t 30000 http://127.0.0.1:5173 || (cat ../frontend-preview.log && exit 1)

      - name: Run Playwright UI Tests
        working-directory: playwright-e2e
        env:
          ENVIRONMENT: LOCAL
          TZ: Australia/Adelaide
          BASE_URL: http://127.0.0.1:5173
          API_BASE_URL: http://127.0.0.1:4000
          USER_NAME: ${{ secrets.E2E_USER_NAME || 'admin' }}
          PASSWORD: ${{ secrets.E2E_PASSWORD || 'password123' }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/ui-results-${{ matrix.project }}.json
        run: |
          npx playwright test src/tests/ui --config=src/config/playwright.config.ts --project=${{ matrix.project }} --reporter=blob,allure-playwright,list,json

      - name: Generate UI Quality Gate Step Summary
        if: always()
        working-directory: playwright-e2e
        run: node scripts/generate-playwright-summary.js test-results/ui-results-${{ matrix.project }}.json "UI Automation (${{ matrix.project }})" "playwright-traces-${{ matrix.project }}"

      - name: Upload Playwright Failure Traces & Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.project }}
          path: |
            playwright-e2e/test-results/
            playwright-e2e/reports/test-artifacts/
          retention-days: 7

      - name: Upload Ephemeral Server Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ephemeral-server-logs-${{ matrix.project }}
          path: |
            backend-server.log
            frontend-preview.log
          retention-days: 7

      - name: Upload Blob Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.project }}
          path: playwright-e2e/blob-report
          retention-days: 7

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.project }}
          path: playwright-e2e/reports/allure-results
          retention-days: 7

      - name: Stop Ephemeral Servers
        if: always()
        run: |
          pkill -f "node dist/server.js" || true
          pkill -f "vite preview" || true

  # STAGE 3: Merge Blob Reports, Build Allure Dashboard & Deploy
  deploy-report:
    name: Merge Reports & Deploy Allure
    needs: [api-tests, ui-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: playwright-e2e/package-lock.json

      - name: Install Playwright Dependencies
        working-directory: playwright-e2e
        run: npm ci

      - name: Download all Blob Reports
        uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          path: playwright-e2e/all-blobs
          merge-multiple: true

      - name: Merge Playwright Blob Reports into HTML Report
        working-directory: playwright-e2e
        run: |
          npx playwright merge-reports --reporter=html all-blobs

      - name: Upload Consolidated HTML Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report-ci
          path: playwright-e2e/playwright-report
          retention-days: 7

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Download All Allure Results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true

      - name: Test Report Summary
        run: |
          echo "### 📊 Cross-Browser Matrix & API Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **API Tests:** Decoupled single-pass execution (Chromium, 4 workers)" >> $GITHUB_STEP_SUMMARY
          echo "- **UI Tests:** Cross-browser matrix (chromium, firefox, webkit, mobile-chrome, mobile-safari)" >> $GITHUB_STEP_SUMMARY
          echo "- **Report Link:** https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/AutomationReports/CI/${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY

      - name: Generate Allure Report
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: allure-results
          gh_pages: gh-pages
          allure_report: allure-report
          allure_history: allure-history
          keep_reports: 7
          subfolder: AutomationReports/CI

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
          keep_files: true

      - name: Print Report URL
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          OWNER="${{ github.repository_owner }}"
          echo "✅ Report published successfully!"
          echo "📊 Report URL: https://${OWNER}.github.io/${REPO_NAME}/AutomationReports/CI/${{ github.run_number }}"
          echo "📈 Check the job summary for detailed test results."
