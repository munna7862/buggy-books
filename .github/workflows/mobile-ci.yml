# Mobile CI (Android only). See planning/Master/mobile_app_master_plan.md, section 6.
#
# - Every PR that touches the mobile app, its automation or the shared contracts:
#   lint, typecheck, Jest (cold cache) and an APK build.
# - Push to main, nightly, manual dispatch, or a PR labelled `run-mobile-e2e`:
#   also boots an Android emulator, starts the real backend and runs the Maestro flows.
name: Mobile CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "mobile/**"
      - "mobile-automation/**"
      - "shared/**"
      - "backend/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/mobile-ci.yml"
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "mobile-automation/**"
      - "shared/**"
      - "backend/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/mobile-ci.yml"
  schedule:
    - cron: "17 2 * * *" # nightly, 02:17 UTC
  workflow_dispatch:

# One group per PR (or ref). Nightly runs get their own group so a merge can't cancel them.
# Label events other than run-mobile-e2e get a unique group: they skip every job and
# must not cancel the real run. Only PR runs cancel older runs; main and nightly queue.
concurrency:
  group: >-
    mobile-ci-${{ github.event.pull_request.number || github.ref }}${{
    github.event_name == 'schedule' && '-nightly' || '' }}${{
    (github.event.action == 'labeled' && github.event.label.name != 'run-mobile-e2e') && format('-noop-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  APK_PATH: mobile/android/app/build/outputs/apk/release/app-release.apk

jobs:
  quality:
    name: Mobile Lint, Typecheck & Unit Tests
    # Adding a label re-triggers the workflow; only the e2e label needs a new run.
    if: github.event.action != 'labeled' || github.event.label.name == 'run-mobile-e2e'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Lint (app, flow contract check)
        run: |
          npm run lint --workspace=mobile
          npm run lint --workspace=mobile-automation

      - name: Typecheck
        run: npm run typecheck --workspace=mobile

      - name: Unit tests (cold Jest cache)
        run: npm run test:ci --workspace=mobile

      - name: Backend contract test
        working-directory: backend
        run: npx jest src/__tests__/contracts.test.ts
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-secret-do-not-use-in-production

  build-apk:
    name: Build Android APK
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Set up Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Generate native Android project (expo prebuild)
        working-directory: mobile
        run: npm run prebuild:android

      # A release build embeds the JS bundle, so the emulator needs no Metro server.
      # It is signed with the debug keystore that prebuild generates and is for testing only.
      # x86_64 only, to match the CI emulator and keep the build fast.
      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon
        env:
          EXPO_PUBLIC_API_URL: http://localhost:4000

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.1
        with:
          name: buggybooks-android-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14

  emulator-e2e:
    name: Maestro on Android Emulator
    needs: build-apk
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'run-mobile-e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MAESTRO_VERSION: "2.12.1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Set up Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Download APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: buggybooks-android-apk
          path: apk

      - name: Build & start backend
        run: |
          npm run build --workspace=buggy-books-backend
          cd backend
          nohup node dist/server.js > ../backend.log 2>&1 &
          npx wait-on -t 60000 http://127.0.0.1:4000/api/health || (cat ../backend.log && exit 1)
        env:
          PORT: 4000
          NODE_ENV: production
          JWT_SECRET: ci-test-secret-do-not-use-in-production

      - name: Install Maestro ${{ env.MAESTRO_VERSION }}
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Maestro flows
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            adb reverse tcp:4000 tcp:4000
            adb install -r apk/app-release.apk
            mkdir -p mobile-automation/reports
            npm run test:maestro --workspace=mobile-automation -- --format junit --output "$PWD/mobile-automation/reports/maestro-junit.xml" --debug-output "$PWD/mobile-automation/reports/debug" || { adb logcat -d > mobile-automation/reports/logcat.txt; adb exec-out screencap -p > mobile-automation/reports/final-screen.png; exit 1; }

      - name: Upload Maestro reports & backend log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.1
        with:
          name: maestro-reports
          path: |
            mobile-automation/reports/
            backend.log
          if-no-files-found: warn
          retention-days: 14
