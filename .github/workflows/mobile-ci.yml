name: Mobile E2E (Maestro & Android)

on:
  push:
    branches: [main, "feature/**"]
    paths:
      - 'mobile/**'
      - 'mobile-automation/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'mobile-automation/**'
      - '.github/workflows/mobile-ci.yml'
  schedule:
    - cron: '0 2 * * *' # Nightly regression run
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  maestro-android:
    name: Headless Android Emulator & Maestro E2E
    runs-on: macos-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Set up Java 17
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Maestro CLI
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Set up Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Start Backend Server
        run: |
          npm run dev:backend &
          npx wait-on http://localhost:4000/api/books -t 30000
        env:
          PORT: 4000
          NODE_ENV: test
          JWT_SECRET: ci-test-secret-do-not-use-in-production

      - name: Export Offline JavaScript Bundle & Prebuild Android
        working-directory: mobile
        run: |
          npx expo export --platform android
          npx expo prebuild --platform android --clean

      - name: Assemble Standalone Debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Run Android Emulator & Maestro Tests
        uses: reactivecircus/android-emulator-runner@62dbb605bba737720e10b196cb4220d374026a6d # v2.33.0
        with:
          api-level: 34
          target: google_apis
          arch: arm64-v8a
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim
          script: |
            # 1. Reverse backend port so emulator localhost:4000 bridges directly to host
            adb reverse tcp:4000 tcp:4000

            # 2. Enable accelerometer auto-rotation for MOB-B6 landscape test
            adb shell settings put system accelerometer_rotation 1

            # 3. Install prebuilt self-signed standalone APK
            adb install mobile/android/app/build/outputs/apk/debug/app-debug.apk

            # 4. Execute Maestro declarative flows
            maestro test mobile-automation/.maestro/

      - name: Upload Maestro Test Artifacts & Screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.1
        if: always()
        with:
          name: maestro-artifacts
          path: |
            ~/.maestro/tests/
            mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
